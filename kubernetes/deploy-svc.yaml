apiVersion: apps/v1
kind: Deployment
metadata:
  name: tic-tac-toe
  namespace: aksar
  labels:
    app: tic-tac-toe

spec:
  replicas: 3

  selector:
    matchLabels:
      app: tic-tac-toe

  template:
    metadata:
      labels:
        app: tic-tac-toe

    spec:
      containers:
        - name: tic-tac-toe
          image: 060119699323.dkr.ecr.ap-south-2.amazonaws.com/aksarsr/ecr:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            
apiVersion: v1
kind: Service
metadata:
  name: tic-tac-toe
  namespace: aksar
  labels:
    app: tic-tac-toe

spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http

  selector:
    app: tic-tac-toe